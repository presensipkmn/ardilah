        const UserAbsensi = ({ user, settings, users }) => {
            const [lokasi, setLokasi] = React.useState(null);
            const [jarak, setJarak] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            const [statusInfo, setStatusInfo] = React.useState('Mencari lokasi GPS Anda...');
            
            const [showIzin, setShowIzin] = React.useState(false);
            const [izinData, setIzinData] = React.useState({ status: 'Sakit', keterangan: '' });
            const [bypassMode, setBypassMode] = React.useState(false);
            const [adminPass, setAdminPass] = React.useState("");
            const [pendingAction, setPendingAction] = React.useState(null);

            const hariIni = getTanggalLokal();
            const [recordHariIni, setRecordHariIni] = React.useState(null);

            React.useEffect(() => {
                const unsub = db.collection('absensi').doc(`${hariIni}_${user.nip}`).onSnapshot(doc => {
                    if (doc.exists) setRecordHariIni(doc.data());
                }, err => {
                    console.error("Sinkronisasi absensi error:", err);
                });
                return () => unsub();
            }, [hariIni, user.nip]);

            React.useEffect(() => {
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const userLat = position.coords.latitude;
                            const userLng = position.coords.longitude;
                            setLokasi({ lat: userLat, lng: userLng });
                            
                            const jrk = hitungJarak(userLat, userLng, settings?.lat, settings?.lng);
                            setJarak(Math.round(jrk));
                            setLoading(false);
                            
                            if (jrk <= settings?.radius) {
                                setStatusInfo('Anda berada di dalam area puskesmas. Silakan absen.');
                            } else {
                                setStatusInfo(`Anda berada di luar area (${Math.round(jrk)}m dari puskesmas).`);
                            }
                        },
                        (error) => { setLoading(false); setStatusInfo('Gagal mendapatkan lokasi GPS. Pastikan Izin Lokasi diaktifkan.'); },
                        { enableHighAccuracy: true }
                    );
                } else {
                    setLoading(false); setStatusInfo('Peramban Anda tidak mendukung GPS.');
                }
            }, [settings]);

            const executeAbsen = (jenis) => {
                const now = new Date();
                const currentJam = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                let keterangan = "";
                let docId = `${hariIni}_${user.nip}`; 
                let dataToSave = {};

                const jadwalHarian = getJadwalHarian(settings, hariIni);
                if (jadwalHarian.libur) {
                    return window.showToast(`Ditolak: Hari ini adalah hari libur (${jadwalHarian.ket}).`, "error");
                }

                if (jenis === 'Datang') {
                    if (recordHariIni && recordHariIni.datang !== "") return window.showToast("Anda sudah memiliki riwayat absen DATANG hari ini.", "error");
                    
                    if (jadwalHarian.mulaiDatang && currentJam < jadwalHarian.mulaiDatang) return window.showToast(`Anda belum diizinkan absensi Datang. Waktu buka: ${jadwalHarian.mulaiDatang}`, "warning");
                    
                    let currentStatus = "Hadir";
                    if (jadwalHarian.batasAutoAlpa && currentJam > jadwalHarian.batasAutoAlpa) {
                        currentStatus = "Alpa";
                        keterangan = "Melebihi batas Auto Alpa";
                        window.showToast(`Absen tercatat, namun Anda berstatus ALPA karena melebihi jam ${jadwalHarian.batasAutoAlpa}`, "error");
                    } else if (jadwalHarian.batasDatang && currentJam > jadwalHarian.batasDatang) {
                        const [bJ, bM] = jadwalHarian.batasDatang.split(':').map(Number);
                        const [cJ, cM] = currentJam.split(':').map(Number);
                        let terlambatMenit = (cJ * 60 + cM) - (bJ * 60 + bM);
                        let textTerlambat = terlambatMenit >= 60 ? `Terlambat ${Math.floor(terlambatMenit/60)} jam ${terlambatMenit%60} menit` : `Terlambat ${terlambatMenit} menit`;
                        keterangan = `Terlambat ${textTerlambat}`;
                        window.showToast(`Absen Datang Berhasil, namun Anda ${keterangan}`, "warning");
                    } else {
                        window.showToast(`Berhasil Absen Datang tepat waktu!\nJarak Anda: ${jarak} meter.`, "success");
                    }

                    dataToSave = { tanggal: hariIni, nip: user.nip, nama: user.nama, datang: currentJam, pulang: "", status: currentStatus, keterangan: keterangan, jarak: jarak };
                
                } else if (jenis === 'Pulang') {
                    if (recordHariIni && recordHariIni.pulang !== "") return window.showToast("Anda sudah melakukan Absen PULANG hari ini.", "error");
                    
                    if (jadwalHarian.mulaiPulang && currentJam < jadwalHarian.mulaiPulang) return window.showToast(`Anda belum diizinkan absensi Pulang. Waktu buka: ${jadwalHarian.mulaiPulang}`, "warning");
                    
                    let keteranganPulang = recordHariIni?.keterangan || "";
                    if (jadwalHarian.batasPulang && currentJam > jadwalHarian.batasPulang) {
                        const [bJ, bM] = jadwalHarian.batasPulang.split(':').map(Number);
                        const [cJ, cM] = currentJam.split(':').map(Number);
                        let lemburMenit = (cJ * 60 + cM) - (bJ * 60 + bM);
                        let textLembur = lemburMenit >= 60 ? `Lembur ${Math.floor(lemburMenit/60)} jam ${lemburMenit%60} menit` : `Lembur ${lemburMenit} menit`;
                        keteranganPulang = keteranganPulang ? `${keteranganPulang}, ${textLembur}` : textLembur;
                        window.showToast(`Berhasil Absen Pulang!\n${textLembur}`, "success");
                    } else {
                        window.showToast(`Berhasil Absen Pulang!\nJarak Anda: ${jarak} meter.`, "success");
                    }

                    if (recordHariIni) {
                        db.collection('absensi').doc(docId).update({ pulang: currentJam, keterangan: keteranganPulang });
                        localStorage.setItem('device_absen_data', JSON.stringify({ tanggal: hariIni, nip: user.nip }));
                        setPendingAction(null);
                        setBypassMode(false);
                        return;
                    } else {
                        dataToSave = { tanggal: hariIni, nip: user.nip, nama: user.nama, datang: "", pulang: currentJam, status: "Hadir", keterangan: keteranganPulang, jarak: jarak };
                    }
                }

                db.collection('absensi').doc(docId).set(dataToSave, { merge: true });
                localStorage.setItem('device_absen_data', JSON.stringify({ tanggal: hariIni, nip: user.nip }));
                setPendingAction(null);
                setBypassMode(false);
            };

            const prosesAbsen = (jenis) => {
                const deviceData = JSON.parse(localStorage.getItem('device_absen_data') || '{}');
                if (deviceData.tanggal === hariIni && deviceData.nip !== user.nip && !bypassMode) {
                    setPendingAction(jenis); 
                    return;
                }
                executeAbsen(jenis);
            };

            const handleBypassSubmit = (e) => {
                e.preventDefault();
                const adminValid = users.find(u => u.role === 'admin' && u.password === adminPass);
                if (!adminValid) {
                    window.showToast("Password Admin salah!", "error");
                } else {
                    setBypassMode(true);
                    executeAbsen(pendingAction);
                }
            };

            const prosesIzin = (e) => {
                e.preventDefault();
                const now = new Date();
                const currentJam = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                let docId = `${hariIni}_${user.nip}`; 
                
                if (recordHariIni && recordHariIni.datang !== "") return window.showToast("Anda sudah melakukan absensi/izin untuk hari ini.", "error");

                const dataToSave = { 
                    tanggal: hariIni, nip: user.nip, nama: user.nama, datang: currentJam, pulang: currentJam, 
                    status: izinData.status, keterangan: izinData.keterangan, jarak: 0 
                };

                db.collection('absensi').doc(docId).set(dataToSave, { merge: true })
                    .then(() => {
                        window.showToast(`Pengajuan ${izinData.status} berhasil disimpan!`, "success");
                        setShowIzin(false);
                        setIzinData({ status: 'Sakit', keterangan: '' });
                    }).catch(err => window.showToast("Error: " + err.message, "error"));
            };

            const isDiArea = jarak !== null && jarak <= settings?.radius;

            return (
                <div className="space-y-6 max-w-lg mx-auto mt-4 md:mt-10">
                    
                    {pendingAction && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-2xl w-full max-w-md shadow-2xl text-center border-t-4 border-amber-500">
                                <LucideIcon name="shield-alert" className="w-12 h-12 text-amber-500 mx-auto mb-3" />
                                <h3 className="text-lg font-bold mb-2 text-slate-800">Peringatan Perangkat Ganda</h3>
                                <p className="text-slate-600 text-sm mb-4">Perangkat (HP/Laptop) ini sudah digunakan untuk absensi oleh pegawai lain hari ini. Masukkan Password Admin untuk memberi izin.</p>
                                <form onSubmit={handleBypassSubmit} className="space-y-3">
                                    <input type="password" placeholder="Password Admin..." required value={adminPass} onChange={e=>setAdminPass(e.target.value)} className="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-amber-500 text-center" />
                                    <div className="flex gap-2 justify-center pt-2">
                                        <button type="button" onClick={() => {setPendingAction(null); setAdminPass('');}} className="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl">Batal</button>
                                        <button type="submit" className="px-4 py-2 bg-amber-500 text-white rounded-xl font-bold">Izinkan Absen</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    <div className="bg-white p-8 rounded-3xl shadow-lg border border-slate-100 text-center relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-2 bg-teal-500"></div>
                        <div className="w-20 h-20 bg-teal-50 text-teal-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                            <LucideIcon name="map-pin" className="w-10 h-10" />
                        </div>
                        <h2 className="text-2xl font-bold text-slate-800 mb-2">Presensi GPS</h2>
                        
                        {loading ? (
                            <div className="flex justify-center my-6"><div className="loader"></div></div>
                        ) : (
                            <div className={`p-4 rounded-xl text-sm mb-8 ${isDiArea ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}`}>
                                <p className="font-bold">{statusInfo}</p>
                                {jarak !== null && <p className="mt-1 opacity-80">Batas radius puskesmas: {settings?.radius}m</p>}
                            </div>
                        )}

                        <div className="grid grid-cols-2 gap-4">
                            <button onClick={() => prosesAbsen('Datang')} disabled={!isDiArea || loading} className={`p-5 rounded-2xl font-bold flex flex-col items-center justify-center transition ${isDiArea ? 'bg-emerald-500 hover:bg-emerald-600 text-white shadow-lg shadow-emerald-200' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}`}>
                                <LucideIcon name="log-in" className="mb-3 w-6 h-6" /> Absen Datang
                            </button>
                            <button onClick={() => prosesAbsen('Pulang')} disabled={!isDiArea || loading} className={`p-5 rounded-2xl font-bold flex flex-col items-center justify-center transition ${isDiArea ? 'bg-teal-500 hover:bg-teal-600 text-white shadow-lg shadow-teal-200' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}`}>
                                <LucideIcon name="log-out" className="mb-3 w-6 h-6" /> Absen Pulang
                            </button>
                        </div>

                        <div className="mt-6 pt-6 border-t border-slate-100">
                            {!showIzin ? (
                                <button onClick={() => setShowIzin(true)} className="w-full p-4 rounded-2xl font-bold flex flex-col items-center justify-center transition bg-amber-50 hover:bg-amber-100 text-amber-600 border border-amber-200 shadow-sm">
                                    <LucideIcon name="clipboard-edit" className="mb-2 w-6 h-6" />
                                    Ajukan Izin / Sakit / Dinas Luar
                                </button>
                            ) : (
                                <form onSubmit={prosesIzin} className="bg-slate-50 p-5 rounded-2xl border border-slate-200 text-left space-y-4">
                                    <h3 className="font-bold text-slate-700 flex items-center">
                                        <LucideIcon name="file-text" className="w-4 h-4 mr-2 text-amber-500" /> Formulir Pengajuan
                                    </h3>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-500 mb-1">Status Kehadiran</label>
                                        <select value={izinData.status} onChange={e => setIzinData({...izinData, status: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-amber-500 bg-white text-sm" required>
                                            <option value="Sakit">Sakit</option>
                                            <option value="Izin">Izin</option>
                                            <option value="Dinas Luar">Dinas Luar</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-500 mb-1">Keterangan / Alasan</label>
                                        <textarea required value={izinData.keterangan} onChange={e => setIzinData({...izinData, keterangan: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-amber-500 text-sm" rows="3" placeholder="Tuliskan alasan lengkap..."></textarea>
                                    </div>
                                    <div className="flex gap-3 pt-2">
                                        <button type="button" onClick={() => setShowIzin(false)} className="flex-1 p-2.5 bg-slate-200 text-slate-600 rounded-xl font-bold text-sm hover:bg-slate-300 transition">Batal</button>
                                        <button type="submit" className="flex-1 p-2.5 bg-amber-500 text-white rounded-xl font-bold text-sm hover:bg-amber-600 shadow-md shadow-amber-200 transition">Kirim Pengajuan</button>
                                    </div>
                                </form>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const UserRekap = ({ user }) => {
            const hariIni = getTanggalLokal();
            const [tanggalMulai, setTanggalMulai] = React.useState(hariIni);
            const [tanggalAkhir, setTanggalAkhir] = React.useState(hariIni);
            
            const [rawData, setRawData] = React.useState([]);
            const [rekapKu, setRekapKu] = React.useState([]);
            const [isLoading, setIsLoading] = React.useState(true);

            React.useEffect(() => {
                const unsub = db.collection('absensi')
                    .where('nip', '==', user.nip)
                    .onSnapshot(snapshot => {
                        const semuaData = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
                        setRawData(semuaData);
                        setIsLoading(false);
                    }, err => {
                        console.error("Error Firebase:", err);
                        window.showToast("Error: " + err.message, "error");
                        setIsLoading(false);
                    });
                
                return () => unsub();
            }, [user.nip]);

            React.useEffect(() => {
                const dataDifilter = rawData.filter(a => {
                    return (!tanggalMulai || a.tanggal >= tanggalMulai) && (!tanggalAkhir || a.tanggal <= tanggalAkhir);
                });
                const sortedData = dataDifilter.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));
                setRekapKu(sortedData);
            }, [rawData, tanggalMulai, tanggalAkhir]);

            const dataDatang = rekapKu.filter(a => a.datang !== "");
            const dataPulang = rekapKu.filter(a => a.pulang !== "");

            return (
                 <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <h2 className="text-2xl font-bold text-slate-800">Rekap Absensi Saya</h2>
                        <div className="flex gap-2 bg-white p-2 rounded-xl shadow-sm border border-slate-100 items-center w-full md:w-auto">
                            <span className="text-sm text-slate-500 font-medium pl-2 hidden md:block">Dari:</span>
                            <input type="date" value={tanggalMulai} onChange={(e)=>setTanggalMulai(e.target.value)} className="p-2 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-teal-500 flex-1 md:w-auto" />
                            <span className="text-sm text-slate-500 font-medium pl-2 hidden md:block">Sampai:</span>
                            <input type="date" value={tanggalAkhir} onChange={(e)=>setTanggalAkhir(e.target.value)} className="p-2 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-teal-500 flex-1 md:w-auto" />
                        </div>
                    </div>

                    <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden mb-6">
                        <div className="p-5 border-b font-bold bg-slate-50 text-teal-900">Rekap Datang / Izin</div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left">
                                <thead className="bg-slate-50 text-slate-500 text-sm border-b">
                                    <tr><th className="p-4 font-medium">Tanggal</th><th className="p-4 font-medium">Jam Datang</th><th className="p-4 font-medium">Status</th><th className="p-4 font-medium">Keterangan</th></tr>
                                </thead>
                                <tbody>
                                    {isLoading ? <tr><td colSpan="4" className="p-6 text-center text-slate-500">Memuat data...</td></tr> : (dataDatang.length === 0 ? <tr><td colSpan="4" className="p-6 text-center text-slate-500">Tidak ada data.</td></tr> : dataDatang.map((row, i) => (
                                        <tr key={i} className="border-b hover:bg-slate-50 transition">
                                            <td className="p-4 text-slate-700">{row.tanggal}</td>
                                            <td className="p-4 text-emerald-600 font-bold">{row.status !== 'Hadir' ? '-' : row.datang}</td>
                                            <td className="p-4">
                                                <span className={`px-3 py-1 text-xs rounded-full font-medium ${row.status === 'Hadir' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>
                                                    {row.status}
                                                </span>
                                            </td>
                                            <td className="p-4 text-sm text-slate-500">{row.keterangan || '-'}</td>
                                        </tr>
                                    )))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                        <div className="p-5 border-b font-bold bg-slate-50 text-teal-900">Rekap Pulang</div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left">
                                <thead className="bg-slate-50 text-slate-500 text-sm border-b">
                                    <tr><th className="p-4 font-medium">Tanggal</th><th className="p-4 font-medium">Jam Pulang</th><th className="p-4 font-medium">Status</th><th className="p-4 font-medium">Keterangan</th></tr>
                                </thead>
                                <tbody>
                                    {isLoading ? <tr><td colSpan="4" className="p-6 text-center text-slate-500">Memuat data...</td></tr> : (dataPulang.length === 0 ? <tr><td colSpan="4" className="p-6 text-center text-slate-500">Tidak ada data.</td></tr> : dataPulang.map((row, i) => (
                                        <tr key={i} className="border-b hover:bg-slate-50 transition">
                                            <td className="p-4 text-slate-700">{row.tanggal}</td>
                                            <td className="p-4 text-rose-500 font-bold">{row.pulang}</td>
                                            <td className="p-4">
                                                <span className={`px-3 py-1 text-xs rounded-full font-medium ${row.status === 'Hadir' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>
                                                    {row.status}
                                                </span>
                                            </td>
                                            <td className="p-4 text-sm text-slate-500">
                                                {row.status === 'Hadir' ? (row.keterangan?.includes('Lembur') ? row.keterangan.split(', ').find(k => k.includes('Lembur')) || row.keterangan : 'Pulang Tepat Waktu') : (row.keterangan || '-')}
                                            </td>
                                        </tr>
                                    )))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                 </div>
            );
        }

        const PiketAbsensi = ({ user, settings }) => {
            const [lokasi, setLokasi] = React.useState(null);
            const [jarak, setJarak] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            const [statusInfo, setStatusInfo] = React.useState('Mencari lokasi GPS Anda...');
            
            const [showIzin, setShowIzin] = React.useState(false);
            const [izinData, setIzinData] = React.useState({ status: 'Sakit', keterangan: '' });

            React.useEffect(() => {
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const userLat = position.coords.latitude;
                            const userLng = position.coords.longitude;
                            setLokasi({ lat: userLat, lng: userLng });
                            
                            const jrk = hitungJarak(userLat, userLng, settings?.lat, settings?.lng);
                            setJarak(Math.round(jrk));
                            setLoading(false);
                            
                            if (jrk <= settings?.radius) {
                                setStatusInfo('Anda berada di dalam area puskesmas. Silakan absen piket.');
                            } else {
                                setStatusInfo(`Anda berada di luar area (${Math.round(jrk)}m dari puskesmas).`);
                            }
                        },
                        (error) => { setLoading(false); setStatusInfo('Gagal mendapatkan lokasi GPS.'); },
                        { enableHighAccuracy: true }
                    );
                } else {
                    setLoading(false); setStatusInfo('Peramban tidak mendukung GPS.');
                }
            }, [settings]);

            const isDiArea = jarak !== null && jarak <= settings?.radius;

            const handleMulaiPiket = async () => {
                const now = new Date();
                const tanggalSekarang = getTanggalLokal(now);
                const currentJam = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

                const jp = settings?.jadwalPiket || { mulaiDatang: "18:00", batasDatang: "20:00", mulaiPulang: "06:00", batasPulang: "08:00" };
                
                if (jp.mulaiDatang && currentJam < jp.mulaiDatang && currentJam > "12:00") {
                    return window.showToast(`Belum diizinkan. Absen piket dibuka jam ${jp.mulaiDatang}`, "warning");
                }

                let keteranganDatang = "";
                if (jp.batasDatang && currentJam > jp.batasDatang && currentJam > "12:00") {
                    keteranganDatang = "Terlambat";
                }

                try {
                    const snap = await db.collection('absensi_piket').where('nip', '==', user.nip).get();
                    const docs = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    const unfinished = docs.filter(d => d.jamSelesai === "");
                    
                    if(unfinished.length > 0) {
                        return window.showToast("Anda masih memiliki sesi piket yang belum diselesaikan!", "warning");
                    }

                    await db.collection('absensi_piket').add({
                        nip: user.nip,
                        nama: user.nama,
                        tanggalMulai: tanggalSekarang,
                        jamMulai: currentJam,
                        tanggalSelesai: "",
                        jamSelesai: "",
                        timestampMulai: now.getTime(),
                        jarakMulai: jarak || 0,
                        status: "Hadir",
                        keterangan: keteranganDatang 
                    });
                    
                    playSuccessSound();
                    window.showToast(`Berhasil Mulai Piket! ${keteranganDatang ? '('+keteranganDatang+')' : ''}`, keteranganDatang ? "warning" : "success");
                } catch(e) { window.showToast("Error: " + e.message, "error"); }
            };

            const handleSelesaiPiket = async () => {
                const now = new Date();
                const tanggalSekarang = getTanggalLokal(now);
                const currentJam = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

                const jp = settings?.jadwalPiket || { mulaiDatang: "18:00", batasDatang: "20:00", mulaiPulang: "06:00", batasPulang: "08:00" };

                try {
                    const snap = await db.collection('absensi_piket').where('nip', '==', user.nip).get();
                    const docs = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    const unfinished = docs.filter(d => d.jamSelesai === "").sort((a,b) => b.timestampMulai - a.timestampMulai);
                    
                    if(unfinished.length === 0) {
                        return window.showToast("Tidak ada data Piket aktif yang belum diselesaikan.", "warning");
                    }

                    if (jp.mulaiPulang && currentJam < jp.mulaiPulang && currentJam < "12:00") {
                        return window.showToast(`Belum diizinkan. Pulang piket dibuka jam ${jp.mulaiPulang}`, "warning");
                    }

                    let ketSelesai = unfinished[0].keterangan || "";
                    if (jp.batasPulang && currentJam > jp.batasPulang && currentJam < "12:00") {
                        ketSelesai += (ketSelesai ? ", " : "") + "Pulang Lewat Batas";
                    }

                    const docToUpdate = unfinished[0].id;
                    await db.collection('absensi_piket').doc(docToUpdate).update({
                        tanggalSelesai: tanggalSekarang,
                        jamSelesai: currentJam,
                        jarakSelesai: jarak || 0,
                        keterangan: ketSelesai 
                    });
                    
                    playSuccessSound();
                    window.showToast("Berhasil Selesai Piket!", "success");
                } catch(e) { window.showToast("Error: " + e.message, "error"); }
            };

            const prosesIzin = async (e) => {
                e.preventDefault();
                const now = new Date();
                const tanggalSekarang = getTanggalLokal(now);
                const currentJam = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

                try {
                    const snap = await db.collection('absensi_piket').where('nip', '==', user.nip).get();
                    const docs = snap.docs.map(d => d.data());
                    const hasAbsenHariIni = docs.find(d => d.tanggalMulai === tanggalSekarang);
                    
                    if (hasAbsenHariIni) {
                        return window.showToast("Anda sudah melakukan absensi/izin untuk hari ini.", "error");
                    }

                    await db.collection('absensi_piket').add({
                        nip: user.nip,
                        nama: user.nama,
                        tanggalMulai: tanggalSekarang,
                        jamMulai: currentJam,
                        tanggalSelesai: tanggalSekarang,
                        jamSelesai: currentJam,
                        timestampMulai: now.getTime(),
                        jarakMulai: 0,
                        jarakSelesai: 0,
                        status: izinData.status,
                        keterangan: izinData.keterangan
                    });
                    
                    window.showToast(`Pengajuan ${izinData.status} berhasil disimpan!`, "success");
                    setShowIzin(false);
                    setIzinData({ status: 'Sakit', keterangan: '' });
                } catch(e) { window.showToast("Error: " + e.message, "error"); }
            };

            return (
                <div className="space-y-6 max-w-lg mx-auto mt-4 md:mt-10">
                    <div className="bg-white p-8 rounded-3xl shadow-lg border border-slate-100 text-center relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-2 bg-indigo-500"></div>
                        <div className="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-6">
                            <LucideIcon name="moon" className="w-10 h-10" />
                        </div>
                        <h2 className="text-2xl font-bold text-slate-800 mb-2">Presensi Piket Malam</h2>
                        
                        {loading ? ( <div className="flex justify-center my-6"><div className="loader"></div></div> ) : (
                            <div className={`p-4 rounded-xl text-sm mb-8 ${isDiArea ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}`}>
                                <p className="font-bold">{statusInfo}</p>
                            </div>
                        )}

                        <div className="grid grid-cols-2 gap-4">
                            <button onClick={handleMulaiPiket} disabled={!isDiArea || loading} className={`p-5 rounded-2xl font-bold flex flex-col items-center justify-center transition ${isDiArea ? 'bg-indigo-500 hover:bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-400'}`}>
                                <LucideIcon name="log-in" className="mb-3 w-6 h-6" /> Mulai Piket
                            </button>
                            <button onClick={handleSelesaiPiket} disabled={!isDiArea || loading} className={`p-5 rounded-2xl font-bold flex flex-col items-center justify-center transition ${isDiArea ? 'bg-amber-500 hover:bg-amber-600 text-white shadow-md' : 'bg-slate-100 text-slate-400'}`}>
                                <LucideIcon name="log-out" className="mb-3 w-6 h-6" /> Selesai Piket
                            </button>
                        </div>

                        <div className="mt-6 pt-6 border-t border-slate-100">
                            {!showIzin ? (
                                <button onClick={() => setShowIzin(true)} className="w-full p-4 rounded-2xl font-bold flex flex-col items-center justify-center transition bg-amber-50 hover:bg-amber-100 text-amber-600 border border-amber-200 shadow-sm">
                                    <LucideIcon name="clipboard-edit" className="mb-2 w-6 h-6" />
                                    Ajukan Izin / Sakit / Dinas Luar
                                </button>
                            ) : (
                                <form onSubmit={prosesIzin} className="bg-slate-50 p-5 rounded-2xl border border-slate-200 text-left space-y-4">
                                    <h3 className="font-bold text-slate-700 flex items-center">
                                        <LucideIcon name="file-text" className="w-4 h-4 mr-2 text-amber-500" /> Formulir Pengajuan
                                    </h3>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-500 mb-1">Status Kehadiran</label>
                                        <select value={izinData.status} onChange={e => setIzinData({...izinData, status: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-amber-500 bg-white text-sm" required>
                                            <option value="Sakit">Sakit</option>
                                            <option value="Izin">Izin</option>
                                            <option value="Dinas Luar">Dinas Luar</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-500 mb-1">Keterangan / Alasan</label>
                                        <textarea required value={izinData.keterangan} onChange={e => setIzinData({...izinData, keterangan: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-amber-500 text-sm" rows="3" placeholder="Tuliskan alasan lengkap..."></textarea>
                                    </div>
                                    <div className="flex gap-3 pt-2">
                                        <button type="button" onClick={() => setShowIzin(false)} className="flex-1 p-2.5 bg-slate-200 text-slate-600 rounded-xl font-bold text-sm hover:bg-slate-300 transition">Batal</button>
                                        <button type="submit" className="flex-1 p-2.5 bg-amber-500 text-white rounded-xl font-bold text-sm hover:bg-amber-600 shadow-md shadow-amber-200 transition">Kirim Pengajuan</button>
                                    </div>
                                </form>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const PiketRekap = ({ user }) => {
            const hariIni = getTanggalLokal();
            const [tanggalMulai, setTanggalMulai] = React.useState(hariIni);
            const [tanggalAkhir, setTanggalAkhir] = React.useState(hariIni);
            
            const [rawData, setRawData] = React.useState([]);
            const [rekapKu, setRekapKu] = React.useState([]);
            const [isLoading, setIsLoading] = React.useState(true);

            React.useEffect(() => {
                const unsub = db.collection('absensi_piket')
                    .where('nip', '==', user.nip)
                    .onSnapshot(snapshot => {
                        const data = snapshot.docs.map(d => d.data());
                        setRawData(data);
                        setIsLoading(false);
                    });
                return () => unsub();
            }, [user.nip]);

            React.useEffect(() => {
                const filtered = rawData.filter(a => {
                    return (!tanggalMulai || a.tanggalMulai >= tanggalMulai) && (!tanggalAkhir || a.tanggalMulai <= tanggalAkhir);
                });
                setRekapKu(filtered.sort((a, b) => b.timestampMulai - a.timestampMulai));
            }, [rawData, tanggalMulai, tanggalAkhir]);

            return (
                 <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <h2 className="text-2xl font-bold text-slate-800">Rekap Piket Saya</h2>
                        <div className="flex gap-2 bg-white p-2 rounded-xl shadow-sm border border-slate-100 items-center w-full md:w-auto">
                            <span className="text-sm text-slate-500 font-medium pl-2 hidden md:block">Dari:</span>
                            <input type="date" value={tanggalMulai} onChange={(e)=>setTanggalMulai(e.target.value)} className="p-2 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500 flex-1 md:w-auto" />
                            <span className="text-sm text-slate-500 font-medium pl-2 hidden md:block">Sampai:</span>
                            <input type="date" value={tanggalAkhir} onChange={(e)=>setTanggalAkhir(e.target.value)} className="p-2 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500 flex-1 md:w-auto" />
                        </div>
                    </div>

                    <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left">
                                <thead className="bg-slate-50 text-slate-500 text-sm border-b">
                                    <tr><th className="p-4 font-medium">Mulai Piket / Izin</th><th className="p-4 font-medium">Selesai Piket</th><th className="p-4 font-medium">Status</th><th className="p-4 font-medium">Keterangan</th></tr>
                                </thead>
                                <tbody>
                                    {isLoading ? <tr><td colSpan="4" className="p-6 text-center text-slate-500">Memuat data...</td></tr> : (rekapKu.length === 0 ? <tr><td colSpan="4" className="p-6 text-center text-slate-500">Tidak ada data.</td></tr> : rekapKu.map((row, i) => (
                                        <tr key={i} className="border-b hover:bg-slate-50 transition">
                                            <td className="p-4 text-indigo-600 font-bold">{row.tanggalMulai} - {row.jamMulai}</td>
                                            <td className="p-4 text-amber-600 font-bold">{row.tanggalSelesai ? `${row.tanggalSelesai} - ${row.jamSelesai}` : 'Belum Selesai'}</td>
                                            <td className="p-4"><span className={`px-3 py-1 text-xs rounded-full font-medium ${row.status && row.status !== 'Hadir' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}`}>{row.status || 'Hadir'}</span></td>
                                            <td className="p-4 text-sm text-slate-500">{row.keterangan || '-'}</td>
                                        </tr>
                                    )))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                 </div>
            );
        }

        const AdminDataPiket = () => {
            const hariIni = getTanggalLokal();
            const [tanggalMulai, setTanggalMulai] = React.useState(hariIni);
            const [tanggalAkhir, setTanggalAkhir] = React.useState(hariIni);
            const [filterNama, setFilterNama] = React.useState('');
            const [dataPiket, setDataPiket] = React.useState([]);

            const fetchDataPiket = async () => {
                const snapshot = await db.collection('absensi_piket').get();
                const semuaData = snapshot.docs.map(d => d.data());
                
                const filtered = semuaData.filter(a => {
                    const inRange = (!tanggalMulai || a.tanggalMulai >= tanggalMulai) && (!tanggalAkhir || a.tanggalMulai <= tanggalAkhir);
                    const isMatch = a.nama.toLowerCase().includes(filterNama.toLowerCase());
                    return inRange && isMatch;
                });

                setDataPiket(filtered.sort((a, b) => b.timestampMulai - a.timestampMulai));
            };

            return (
                 <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <h2 className="text-2xl font-bold text-slate-800">Pemantauan Piket Malam</h2>
                        <div className="flex flex-wrap gap-2 w-full md:w-auto">
                            <input type="text" placeholder="Cari nama..." value={filterNama} onChange={(e)=>setFilterNama(e.target.value)} className="p-2 border border-slate-200 rounded-lg text-sm flex-1 outline-none focus:ring-2 focus:ring-indigo-500" />
                            <input type="date" value={tanggalMulai} onChange={(e)=>setTanggalMulai(e.target.value)} className="p-2 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
                            <input type="date" value={tanggalAkhir} onChange={(e)=>setTanggalAkhir(e.target.value)} className="p-2 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
                            <button onClick={fetchDataPiket} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Cari</button>
                        </div>
                    </div>

                    <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left">
                                <thead className="bg-slate-50 text-slate-500 text-sm border-b">
                                    <tr><th className="p-4 font-medium">Nama Pegawai</th><th className="p-4 font-medium">Mulai Piket</th><th className="p-4 font-medium">Selesai Piket</th><th className="p-4 font-medium">Keterangan</th><th className="p-4 font-medium">Status</th></tr>
                                </thead>
                                <tbody>
                                    {dataPiket.length === 0 ? <tr><td colSpan="5" className="p-6 text-center text-slate-500">Klik 'Cari' untuk memuat data.</td></tr> : dataPiket.map((row, i) => (
                                        <tr key={i} className="border-b hover:bg-slate-50 transition">
                                            <td className="p-4 font-bold text-slate-700">{row.nama}</td>
                                            <td className="p-4 text-indigo-600 font-medium">{row.tanggalMulai} - {row.jamMulai}</td>
                                            <td className="p-4 text-amber-600 font-medium">{row.tanggalSelesai ? `${row.tanggalSelesai} - ${row.jamSelesai}` : 'Belum Selesai'}</td>
                                            <td className="p-4 text-sm text-slate-500">{row.keterangan || '-'}</td>
                                            <td className="p-4">
                                                {row.status && row.status !== 'Hadir' ? <span className="px-3 py-1 text-xs font-bold bg-purple-100 text-purple-700 rounded-full">{row.status}</span> : (row.jamSelesai ? <span className="px-3 py-1 text-xs font-bold bg-emerald-100 text-emerald-700 rounded-full">Selesai</span> : <span className="px-3 py-1 text-xs font-bold bg-amber-100 text-amber-700 rounded-full">Piket Aktif</span>)}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                 </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
