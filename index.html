    <style>
        body { font-family: 'Poppins', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }

            .page-break { page-break-before: always; }

        .loader-sm { border: 3px solid #f3f3f3; border-top: 3px solid white; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; }

        @keyframes slideDown { 0% { transform: translate(-50%, -100%); opacity: 0; } 100% { transform: translate(-50%, 0); opacity: 1; } }
        .toast-enter { animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .popup-enter { animation: popIn 0.3s ease-out forwards; }

</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel" data-presets="env,react">
        const firebaseConfig = {
            apiKey: "AIzaSyBRVw0m95OI-C-_myk2JrKq5jzsdC-b1sc",
            authDomain: "presensi-pkm-nrr.firebaseapp.com",
            projectId: "presensi-pkm-nrr",
            storageBucket: "presensi-pkm-nrr.firebasestorage.app",
            messagingSenderId: "533822808051",
            appId: "1:533822808051:web:791bff104d608864eabc86"
        };

        let db;
        let auth;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
            auth = firebase.auth();
        } catch (error) {
            console.error("Firebase error:", error);
        }

        window.showToast = (msg, type = 'success') => {
            const event = new CustomEvent('show-toast', { detail: { msg, type } });
            window.dispatchEvent(event);
        };

        const playSuccessSound = () => {
            try {
                const audio = new Audio('https://www.image2url.com/r2/default/files/1786027679808-a23809b2-f6d7-4575-bbb1-a94a4d42fcbc.mp3');
                audio.play().catch(e => console.log("Play audio diblokir oleh browser:", e));
            } catch(e) { console.log("Audio tidak didukung."); }
        };

        function hitungJarak(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; 
        }

        const getTanggalLokal = (d = new Date()) => {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const getJadwalHarian = (settings, dateStr) => {
            const defaultJadwal = { mulaiDatang: "06:00", batasDatang: "07:30", batasAutoAlpa: "09:00", mulaiPulang: "14:00", batasPulang: "15:00" };
            const d = new Date(dateStr);
            const day = d.getDay(); 
            if (day === 0) return { libur: true, ket: "Hari Minggu" };
            
            const liburNasional = settings?.liburKhusus?.find(l => l.tanggal === dateStr);
            if (liburNasional) return { libur: true, ket: liburNasional.ket || "Libur Khusus/Nasional" };

            const j = settings?.jadwalHarian?.[day];
            if (!j) return { libur: false, ...defaultJadwal }; 
            return { libur: false, ...j };
        };

        const LucideIcon = ({ name, className }) => {
            const spanRef = React.useRef(null);
            React.useEffect(() => {
                if (spanRef.current) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className || ''}"></i>`;
                    if (typeof lucide !== 'undefined') {
                        try {
                            lucide.createIcons({ root: spanRef.current });
                        } catch (e) {
                            console.warn("Lucide render error:", e);
                        }
                    }
                }
            }, [name, className]);
            return <span ref={spanRef} style={{ display: 'contents' }}></span>;
        };

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("React Error Caught:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-6 text-center">
                            <div className="bg-rose-50 text-rose-800 p-8 rounded-3xl max-w-lg shadow-xl border border-rose-200">
                                <h2 className="text-2xl font-bold mb-3 text-rose-700">Ups, Terjadi Kesalahan Render</h2>
                                <p className="font-medium text-rose-600 mb-4">{this.state.error?.message}</p>
                                <button onClick={() => window.location.reload()} className="bg-rose-600 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-rose-700 shadow-md transition">Muat Ulang Halaman</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const App = () => {
            const [user, setUser] = React.useState(null);
            const [activeTab, setActiveTab] = React.useState('beranda');
            
            const [usersData, setUsersData] = React.useState([]);
            const [settingsData, setSettingsData] = React.useState(null);
            const [isDbLoading, setIsDbLoading] = React.useState(true);
            const [authError, setAuthError] = React.useState('');
            const [toastMsg, setToastMsg] = React.useState(null);

            React.useEffect(() => {
                const handleToast = (e) => {
                    setToastMsg(e.detail);
                    setTimeout(() => setToastMsg(null), 3500);
                };
                window.addEventListener('show-toast', handleToast);
                return () => window.removeEventListener('show-toast', handleToast);
            }, []);

            React.useEffect(() => {
                if (!db || !auth) { 
                    setAuthError("Gagal memuat layanan Firebase.");
                    setIsDbLoading(false); 
                    return; 
                }

                let unsubSettings = () => {};
                let unsubUsers = () => {};

                const unsubAuth = auth.onAuthStateChanged((currentUser) => {
                    if (currentUser) {
                        setAuthError('');
                        
                        unsubSettings = db.collection('pengaturan').doc('global').onSnapshot(doc => {
                            if (doc.exists) {
                                setSettingsData(doc.data());
                            } else {
                                const baseJadwal = { mulaiDatang: "06:00", batasDatang: "07:30", batasAutoAlpa: "09:00", mulaiPulang: "14:00", batasPulang: "15:00" };
                                const initJadwal = { 1: baseJadwal, 2: baseJadwal, 3: baseJadwal, 4: baseJadwal, 5: baseJadwal, 6: baseJadwal };
                                const defaultSettings = {
                                    sekolah: "UPTD Puskesmas Nangaroro", alamat: "Jl. Kesehatan No. 1", kepsek: "Dr. Budi Santoso", nipKepsek: "198001012005011001",
                                    lat: -6.2088, lng: 106.8456, radius: 500, logoUrl: "", jadwalHarian: initJadwal, liburKhusus: [],
                                    jadwalPiket: { mulaiDatang: "18:00", batasDatang: "20:00", mulaiPulang: "06:00", batasPulang: "08:00" } 
                                };
                                db.collection('pengaturan').doc('global').set(defaultSettings);
                            }
                        }, err => {
                            console.error("Settings DB Error:", err);
                            window.showToast("Gagal mengambil pengaturan.", "warning");
                        });

                        unsubUsers = db.collection('users').onSnapshot(snap => {
                            const data = snap.docs.map(d => {
                                let docData = d.data();
                                if (docData.nis && !docData.nip) { docData.nip = docData.nis; }
                                return { id: d.id, ...docData };
                            });

                            if (data.length === 0) {
                                db.collection('users').doc('admin').set({ nip: 'admin', nama: 'Administrator', role: 'admin', password: 'admin' });
                            } else {
                                setUsersData(data);
                            }
                        }, err => {
                            console.error("Users DB Error:", err);
                            window.showToast("Gagal mengambil anggota.", "warning");
                        });

                        setTimeout(() => setIsDbLoading(false), 500);
                    } else {
                        auth.signInAnonymously().catch((error) => {
                            console.error("Auth Error:", error);
                            setAuthError(error.message);
                            setIsDbLoading(false);
                        });
                    }
                });

                return () => { unsubSettings(); unsubUsers(); unsubAuth(); };
            }, []);

            if (isDbLoading) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center">
                        <div className="loader mb-4"></div>
                        <p className="text-slate-500 font-medium">Menghubungkan ke Database...</p>
                    </div>
                );
            }

            if (authError) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-6 text-center">
                        <div className="bg-rose-50 text-rose-800 p-8 rounded-3xl max-w-lg shadow-xl border border-rose-200">
                            <LucideIcon name="shield-alert" className="w-16 h-16 mx-auto mb-4 text-rose-500" />
                            <h2 className="text-2xl font-bold mb-3 text-rose-700">Akses Ditolak Firebase</h2>
                            <p className="font-medium text-rose-600 mb-4">{authError}</p>
                        </div>
                    </div>
                );
            }

            if (!user) {
                return <Login setUser={setUser} users={usersData} settings={settingsData} />;
            }

            return (
                <div className="flex h-screen overflow-hidden">
                    {toastMsg && (
                        <div className={`toast-enter fixed top-6 left-1/2 transform -translate-x-1/2 z-[100] px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 text-white ${toastMsg.type === 'error' ? 'bg-rose-500' : (toastMsg.type === 'warning' ? 'bg-amber-500' : 'bg-emerald-500')}`}>
                            <LucideIcon name={toastMsg.type === 'error' ? 'alert-circle' : 'check-circle'} className="w-5 h-5" />
                            <span className="font-bold text-sm tracking-wide">{toastMsg.msg}</span>
                        </div>
                    )}

                    <aside className="w-64 bg-teal-600 text-white flex flex-col hidden md:flex no-print shadow-xl z-10 overflow-y-auto">
                        <div className="p-6 text-center border-b border-teal-500/50">
                            {settingsData?.logoUrl ? (
                                <img src={settingsData.logoUrl} alt="Logo" className="w-20 h-20 object-contain bg-white rounded-2xl mx-auto mb-3 shadow-md p-1" />
                            ) : (
                                <div className="w-16 h-16 bg-white rounded-2xl mx-auto flex items-center justify-center text-teal-600 font-bold text-2xl mb-3 shadow-sm transform rotate-3">
                                    <LucideIcon name="hospital" />
                                </div>
                            )}
                            <h2 className="font-bold text-lg tracking-wide leading-tight">{settingsData?.sekolah}</h2>
                            <p className="text-xs text-teal-200 capitalize font-medium mt-2">Role: {user.role}</p>
                        </div>
                        <nav className="flex-1 p-4 space-y-2">
                            {user.role === 'admin' ? (
                                <>
                                    <MenuBtn icon="layout-dashboard" label="Beranda" active={activeTab === 'beranda'} onClick={() => setActiveTab('beranda')} />
                                    <MenuBtn icon="users" label="Anggota" active={activeTab === 'anggota'} onClick={() => setActiveTab('anggota')} />
                                    <MenuBtn icon="clipboard-edit" label="Absen Manual" active={activeTab === 'manual'} onClick={() => setActiveTab('manual')} />
                                    <MenuBtn icon="qr-code" label="Scan QR" active={activeTab === 'scan'} onClick={() => setActiveTab('scan')} />
                                    <MenuBtn icon="moon" label="Data Piket" active={activeTab === 'data-piket'} onClick={() => setActiveTab('data-piket')} />
                                    <MenuBtn icon="file-text" label="Laporan" active={activeTab === 'laporan'} onClick={() => setActiveTab('laporan')} />
                                    <MenuBtn icon="grid" label="Rekap Matriks" active={activeTab === 'matriks'} onClick={() => setActiveTab('matriks')} />
                                    <MenuBtn icon="settings" label="Pengaturan" active={activeTab === 'pengaturan'} onClick={() => setActiveTab('pengaturan')} />
                                </>
                            ) : user.role === 'piket' ? (
                                <>
                                    <MenuBtn icon="layout-dashboard" label="Beranda" active={activeTab === 'beranda'} onClick={() => setActiveTab('beranda')} />
                                    <MenuBtn icon="moon" label="Absen Piket" active={activeTab === 'absen-piket'} onClick={() => setActiveTab('absen-piket')} />
                                    <MenuBtn icon="history" label="Rekap Piket" active={activeTab === 'rekap-piket'} onClick={() => setActiveTab('rekap-piket')} />
                                </>
                            ) : (
                                <>
                                    <MenuBtn icon="layout-dashboard" label="Beranda" active={activeTab === 'beranda'} onClick={() => setActiveTab('beranda')} />
                                    <MenuBtn icon="map-pin" label="Absensi" active={activeTab === 'absensi'} onClick={() => setActiveTab('absensi')} />
                                    <MenuBtn icon="history" label="Rekap Absensi" active={activeTab === 'rekap'} onClick={() => setActiveTab('rekap')} />
                                </>
                            )}
                        </nav>
                    </aside>

                    <main className="flex-1 overflow-y-auto bg-slate-50 relative pb-20 md:pb-0">
                        <header className="bg-teal-600 md:bg-white text-white md:text-slate-800 p-4 flex justify-between items-center no-print shadow-md md:shadow-sm md:border-b md:border-slate-200 sticky top-0 z-20">
                            <div className="flex items-center gap-3 md:hidden">
                                {settingsData?.logoUrl && <img src={settingsData.logoUrl} className="w-8 h-8 object-contain bg-white rounded-lg p-0.5" />}
                                <h1 className="font-bold line-clamp-1">{settingsData?.sekolah}</h1>
                            </div>
                            <div className="hidden md:block">
                                <h1 className="font-bold text-xl capitalize flex items-center gap-2">
                                    <LucideIcon name={activeTab === 'beranda' ? 'layout-dashboard' : activeTab} className="w-6 h-6 text-teal-500" />
                                    {activeTab.replace('-', ' ')}
                                </h1>
                            </div>
                            <div className="flex items-center gap-3 ml-auto">
                                <div className="flex items-center gap-2 bg-teal-700 md:bg-slate-100 px-3 py-1.5 rounded-full border border-teal-500 md:border-slate-200 shadow-inner">
                                    <div className="w-6 h-6 bg-teal-500 md:bg-teal-200 rounded-full flex items-center justify-center">
                                        <LucideIcon name="user" className="w-3 h-3 text-white md:text-teal-700" />
                                    </div>
                                    <span className="text-sm font-medium hidden sm:block">{user.nama}</span>
                                </div>
                                <button onClick={() => {setUser(null); window.showToast("Berhasil Keluar", "success");}} className="p-2 bg-rose-500 md:bg-rose-100 hover:bg-rose-600 md:hover:bg-rose-200 text-white md:text-rose-600 rounded-full transition shadow-md md:shadow-none" title="Keluar">
                                    <LucideIcon name="log-out" className="w-4 h-4" />
                                </button>
                            </div>
                        </header>

                        <div className="p-4 md:p-8">
                            {user.role === 'admin' && activeTab === 'beranda' && <AdminBeranda />}
                            {user.role === 'admin' && activeTab === 'anggota' && <AdminAnggota users={usersData} settings={settingsData} />}
                            {user.role === 'admin' && activeTab === 'manual' && <AdminManual users={usersData} settings={settingsData} />}
                            {user.role === 'admin' && activeTab === 'scan' && <AdminScan users={usersData} settings={settingsData} />}
                            {user.role === 'admin' && activeTab === 'data-piket' && <AdminDataPiket settings={settingsData} />}
                            {user.role === 'admin' && activeTab === 'laporan' && <AdminLaporan settings={settingsData} />}
                            {user.role === 'admin' && activeTab === 'matriks' && <AdminMatriks users={usersData} settings={settingsData} />}
                            {user.role === 'admin' && activeTab === 'pengaturan' && <AdminPengaturan settings={settingsData} />}

                            {user.role === 'piket' && activeTab === 'beranda' && <UserBeranda user={user} />}
                            {user.role === 'piket' && activeTab === 'absen-piket' && <PiketAbsensi user={user} settings={settingsData} />}
                            {user.role === 'piket' && activeTab === 'rekap-piket' && <PiketRekap user={user} />}

                            {user.role === 'user' && activeTab === 'beranda' && <UserBeranda user={user} />}
                            {user.role === 'user' && activeTab === 'absensi' && <UserAbsensi user={user} settings={settingsData} users={usersData} />}
                            {user.role === 'user' && activeTab === 'rekap' && <UserRekap user={user} />}
                        </div>
                        
                        <nav className="md:hidden fixed bottom-0 w-full bg-white border-t flex justify-around p-2 text-xs no-print z-50 overflow-x-auto shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                            {user.role === 'admin' ? (
                                <>
                                    <MobileMenu icon="home" label="Beranda" active={activeTab === 'beranda'} onClick={() => setActiveTab('beranda')} />
                                    <MobileMenu icon="users" label="Anggota" active={activeTab === 'anggota'} onClick={() => setActiveTab('anggota')} />
                                    <MobileMenu icon="qr-code" label="Scan QR" active={activeTab === 'scan'} onClick={() => setActiveTab('scan')} />
                                    <MobileMenu icon="moon" label="Piket" active={activeTab === 'data-piket'} onClick={() => setActiveTab('data-piket')} />
                                    <MobileMenu icon="settings" label="Pengatur..." active={activeTab === 'pengaturan'} onClick={() => setActiveTab('pengaturan')} />
                                </>
                            ) : user.role === 'piket' ? (
                                <>
                                    <MobileMenu icon="home" label="Beranda" active={activeTab === 'beranda'} onClick={() => setActiveTab('beranda')} />
                                    <MobileMenu icon="moon" label="Absen Piket" active={activeTab === 'absen-piket'} onClick={() => setActiveTab('absen-piket')} />
                                    <MobileMenu icon="history" label="Rekap Piket" active={activeTab === 'rekap-piket'} onClick={() => setActiveTab('rekap-piket')} />
                                </>
                            ) : (
                                <>
                                    <MobileMenu icon="home" label="Beranda" active={activeTab === 'beranda'} onClick={() => setActiveTab('beranda')} />
                                    <MobileMenu icon="map-pin" label="Absen" active={activeTab === 'absensi'} onClick={() => setActiveTab('absensi')} />
                                    <MobileMenu icon="history" label="Rekap" active={activeTab === 'rekap'} onClick={() => setActiveTab('rekap')} />
                                </>
                            )}
                        </nav>
                    </main>
                </div>
            );
        };

        const MenuBtn = ({ icon, label, active, onClick }) => (
            <button onClick={onClick} className={`w-full flex items-center p-3 rounded-xl transition font-medium ${active ? 'bg-white/20 text-white shadow-inner backdrop-blur-sm' : 'text-teal-100 hover:bg-teal-500 hover:text-white'}`}>
                <LucideIcon name={icon} className="w-5 h-5 mr-3" /> <span className="whitespace-nowrap">{label}</span>
            </button>
        );

        const MobileMenu = ({ icon, label, active, onClick }) => (
            <button onClick={onClick} className={`flex flex-col items-center p-2 min-w-[60px] ${active ? 'text-teal-600' : 'text-slate-400'}`}>
                <LucideIcon name={icon} className="w-5 h-5 mb-1" /> <span className="font-medium text-[10px] whitespace-nowrap">{label}</span>
            </button>
        );

        const Login = ({ setUser, users, settings }) => {
            const [nip, setNip] = React.useState('');
            const [password, setPassword] = React.useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                const user = users.find(u => (u.nip === nip || u.nis === nip) && u.password === password);
                if (user) {
                    setUser(user);
                    window.showToast(`Selamat datang, ${user.nama}!`, 'success');
                } else {
                    window.showToast('NIP/Username atau Password salah!', 'error');
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-[#D8F0EE]">
                    <div className="bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl w-full max-w-md border border-white/20">
                        <div className="text-center mb-8">
                            {settings?.logoUrl ? (
                                <img src={settings.logoUrl} alt="Logo" className="w-24 h-24 object-contain bg-white rounded-full mx-auto mb-4 shadow-lg p-2 border-4 border-teal-500/30" />
                            ) : (
                                <div className="w-20 h-20 bg-[#3EC2B3] rounded-full mx-auto flex items-center justify-center text-white mb-4 shadow-lg border-4 border-teal-500/30">
                                    <LucideIcon name="hospital" className="w-10 h-10" />
                                </div>
                            )}
                            <h1 className="text-2xl font-bold text-slate-800">SIPENA</h1>
                            <p className="text-slate-500 text-sm mt-1">{settings?.sekolah || 'Silakan login untuk melanjutkan'}</p>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-5">
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">NIP / Username</label>
                                <input type="text" value={nip} onChange={(e)=>setNip(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#3EC2B3] focus:border-transparent focus:outline-none transition" required />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">Password</label>

                }

                let autoKeterangan = dataForm.keterangan;

                let finalStatus = dataForm.status;

                    if (dataForm.jenis === 'Datang') {
                        if (jadwalHarian.batasAutoAlpa && dataForm.jam > jadwalHarian.batasAutoAlpa) {
                            finalStatus = 'Alpa';
                            autoKeterangan = autoKeterangan ? `Melebihi batas Auto Alpa (${autoKeterangan})` : "Melebihi batas waktu kehadiran";
                        } else if (jadwalHarian.batasDatang && dataForm.jam > jadwalHarian.batasDatang) {
                            const [bJ, bM] = jadwalHarian.batasDatang.split(':').map(Number);
                            const [cJ, cM] = dataForm.jam.split(':').map(Number);
                            let terlambatMenit = (cJ * 60 + cM) - (bJ * 60 + bM);
                            let textTerlambat = terlambatMenit >= 60 ? `Terlambat ${Math.floor(terlambatMenit/60)}j ${terlambatMenit%60}m` : `Terlambat ${terlambatMenit}m`;
                            autoKeterangan = autoKeterangan ? `${textTerlambat} (${autoKeterangan})` : textTerlambat;
                        }
                    } 
                    else if (dataForm.jenis === 'Pulang') {
                        let prevKeterangan = existingRecord?.keterangan || "";
                        if (jadwalHarian.batasPulang && dataForm.jam > jadwalHarian.batasPulang) {
                            const [bJ, bM] = jadwalHarian.batasPulang.split(':').map(Number);
                            const [cJ, cM] = dataForm.jam.split(':').map(Number);
                            let lemburMenit = (cJ * 60 + cM) - (bJ * 60 + bM);
                            let textLembur = lemburMenit >= 60 ? `Lembur ${Math.floor(lemburMenit/60)}j ${lemburMenit%60}m` : `Lembur ${lemburMenit}m`;
                            autoKeterangan = prevKeterangan ? `${prevKeterangan}, ${textLembur}` : textLembur;
                            if (dataForm.keterangan) autoKeterangan += ` (${dataForm.keterangan})`;
                        } else {
                            autoKeterangan = prevKeterangan ? prevKeterangan : "";
                            if (dataForm.keterangan) autoKeterangan += (autoKeterangan ? `, ` : ``) + `(${dataForm.keterangan})`;
                        }
                    }
                }

                let dataToSave = {
                    tanggal: dataForm.tanggal,
                    nip: dataForm.nip,
                    nama: selectedUser.nama,
                    status: finalStatus,
                    keterangan: autoKeterangan || (finalStatus !== 'Hadir' ? finalStatus : "Absen Manual Admin"),
                    jarak: 0
                };

                if (dataForm.jenis === 'Datang' || finalStatus !== 'Hadir') {
                    dataToSave.datang = dataForm.jam || "";
                    if (!existingRecord) dataToSave.pulang = ""; 
                    if (finalStatus !== 'Hadir') dataToSave.pulang = dataForm.jam || "";
                } else if (dataForm.jenis === 'Pulang') {
                    dataToSave.pulang = dataForm.jam || "";
                    if (!existingRecord) dataToSave.datang = "";
                    if (existingRecord) dataToSave.status = existingRecord.status; 
                }

                db.collection('absensi').doc(docId).set(dataToSave, { merge: true })
                  .then(() => {
                      window.showToast(`Data Absensi ${dataForm.jenis} Berhasil Disimpan!`, "success");
                      setFormData({ nip: '', tanggal: hariIni, jenis: 'Datang', jam: '', status: 'Hadir', keterangan: '' });
                  })
                  .catch(err => window.showToast("Error: " + err.message, "error"));
            };

            const handleSimpanManual = (e) => {
                e.preventDefault();
                if(!formData.nip) return window.showToast("Pilih Pegawai terlebih dahulu!", "warning");
                if(!formData.jam && formData.status === 'Hadir') return window.showToast("Jam absensi wajib diisi!", "warning");
                
                const jadwalHarian = getJadwalHarian(settings, formData.tanggal);
                if (jadwalHarian.libur) {
                    setConfirmLiburModal(jadwalHarian.ket);
                } else {
                    laksanakanSimpan(formData);
                }
            };

            return (
                <div className="space-y-6 max-w-2xl">
                    <div>
                        <h2 className="text-2xl font-bold text-slate-800">Absensi Manual</h2>
                        <p className="text-slate-500 text-sm">Input absensi manual reguler untuk pegawai yang terkendala perangkat.</p>
                    </div>

                    {confirmLiburModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-2xl w-full max-w-sm shadow-2xl text-center">
                                <h3 className="text-lg font-bold mb-2 text-amber-600">Peringatan Hari Libur</h3>
                                <p className="text-slate-600 text-sm mb-6">Tanggal yang dipilih adalah hari libur ({confirmLiburModal}). Tetap ingin menyimpan absen?</p>
                                <div className="flex justify-center gap-3">
                                    <button onClick={() => setConfirmLiburModal(null)} className="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl font-medium">Batal</button>
                                    <button onClick={() => { setConfirmLiburModal(null); laksanakanSimpan(formData); }} className="px-4 py-2 bg-teal-600 text-white rounded-xl font-medium">Ya, Simpan</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100">
                        <form onSubmit={handleSimpanManual} className="space-y-5">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <div>
                                    <label className="block text-sm font-medium mb-1.5 text-slate-600">Pilih Pegawai</label>
                                    <select value={formData.nip} onChange={e=>setFormData({...formData, nip: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-teal-500 bg-white" required>
                                        <option value="">-- Pilih Pegawai --</option>
                                        {users.filter(u => u.role === 'user').map(u => (
                                            <option key={u.nip} value={u.nip}>{u.nama} ({u.nip})</option>
                                        ))}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1.5 text-slate-600">Jenis Absen</label>
                                    <select value={formData.jenis} onChange={e=>setFormData({...formData, jenis: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-teal-500 bg-white">
                                        <option value="Datang">Absen Datang</option>
                                        <option value="Pulang">Absen Pulang</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1.5 text-slate-600">Tanggal</label>
                                    <input type="date" value={formData.tanggal} onChange={e=>setFormData({...formData, tanggal: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-teal-500" required />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1.5 text-slate-600">Status Kehadiran</label>
                                    <select value={formData.status} onChange={e=>setFormData({...formData, status: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-teal-500 bg-white">
                                        <option value="Hadir">Hadir</option>
                                        <option value="Sakit">Sakit</option>
                                        <option value="Izin">Izin</option>
                                        <option value="Dinas Luar">Dinas Luar</option>
                                        <option value="Alpa">Alpa</option>
                                    </select>
                                </div>
                                <div className="md:col-span-2">
                                    <label className="block text-sm font-medium mb-1.5 text-slate-600">Jam {formData.jenis}</label>
                                    <input type="time" value={formData.jam} onChange={e=>setFormData({...formData, jam: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-teal-500" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1.5 text-slate-600">Keterangan Tambahan (Opsional)</label>
                                <textarea value={formData.keterangan} onChange={e=>setFormData({...formData, keterangan: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-teal-500" rows="2" placeholder="Contoh: Lupa bawa HP, HP Rusak, dsb..."></textarea>
                            </div>
                            <button type="submit" className="w-full bg-teal-600 text-white p-3.5 rounded-xl font-bold hover:bg-teal-700 transition shadow-lg shadow-teal-200">
                                Simpan Data Absensi
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const AdminScan = ({ users, settings }) => {
            const [scanPopup, setScanPopup] = React.useState(null); 
            const [cameraError, setCameraError] = React.useState('');
            const [scanMode, setScanMode] = React.useState(null); 
            
            const isProcessing = React.useRef(false); 
            const scannerRef = React.useRef(null); 
            const modeRef = React.useRef(scanMode);

            const usersRef = React.useRef(users);
            const settingsRef = React.useRef(settings);

            React.useEffect(() => { usersRef.current = users; }, [users]);
            React.useEffect(() => { settingsRef.current = settings; }, [settings]);
            React.useEffect(() => { modeRef.current = scanMode; }, [scanMode]);

            const triggerPopup = (type, title, msg) => {
                setScanPopup({ type, title, msg });
                setTimeout(() => {
                    setScanPopup(null);
                    isProcessing.current = false;
                }, 3000);
            };

            const processScan = async (decodedText) => {
                if (isProcessing.current) return; 
                isProcessing.current = true; 

                const currentUsers = usersRef.current;
                const currentSettings = settingsRef.current;
                const currentMode = modeRef.current;

                const user = currentUsers.find(u => u.nip === decodedText);
                if (!user) {
                    return triggerPopup('error', 'Gagal!', `NIP ${decodedText} tidak terdaftar!`);
                }
                if (user.role === 'piket') {
                    return triggerPopup('error', 'Ditolak!', `Pegawai ${user.nama} adalah petugas piket malam. Tidak bisa discan di menu reguler.`);
                }

                const now = new Date();
                const currentJam = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                const tanggalSekarang = getTanggalLokal(now);
                const docId = `${tanggalSekarang}_${user.nip}`; 
                
                const jadwalHarian = getJadwalHarian(currentSettings, tanggalSekarang);
                
                if (jadwalHarian.libur) {
                    return triggerPopup('error', 'Ditolak!', `Hari ini adalah hari libur (${jadwalHarian.ket}).`);
                }

                const docSnap = await db.collection('absensi').doc(docId).get();
                let existingRecord = docSnap.exists ? docSnap.data() : null;
                
                let keterangan = "";

                if (currentMode === 'Datang') {
                    if (existingRecord && existingRecord.datang !== "") {
                        return triggerPopup('error', 'Ditolak!', `Pegawai ${user.nama} sudah melakukan absen Datang hari ini.`);
                    }
                    
                    if (jadwalHarian.mulaiDatang && currentJam < jadwalHarian.mulaiDatang) {
                        return triggerPopup('error', 'Belum Diizinkan!', `Absen Datang dibuka jam ${jadwalHarian.mulaiDatang}`);
                    }
                    
                    let isLate = false;
                    let currentStatus = "Hadir";

                    if (jadwalHarian.batasAutoAlpa && currentJam > jadwalHarian.batasAutoAlpa) {
                        currentStatus = "Alpa";
                        keterangan = "Melebihi batas Auto Alpa";
                    } else if (jadwalHarian.batasDatang && currentJam > jadwalHarian.batasDatang) {
                        isLate = true;
                        const [bJ, bM] = jadwalHarian.batasDatang.split(':').map(Number);
                        const [cJ, cM] = currentJam.split(':').map(Number);
                        let terlambatMenit = (cJ * 60 + cM) - (bJ * 60 + bM);
                        keterangan = terlambatMenit >= 60 ? `Terlambat ${Math.floor(terlambatMenit/60)}j ${terlambatMenit%60}m` : `Terlambat ${terlambatMenit}m`;
                    }
                    
                    const dataToSave = { tanggal: tanggalSekarang, nip: user.nip, nama: user.nama, datang: currentJam, pulang: existingRecord?.pulang || "", status: currentStatus, keterangan: keterangan, jarak: 0 };
                    
                    db.collection('absensi').doc(docId).set(dataToSave, { merge: true }).then(() => {
                        playSuccessSound(); 
                        triggerPopup(currentStatus === 'Alpa' ? 'error' : (isLate ? 'warning' : 'success'), currentStatus === 'Alpa' ? 'Tercatat Alpa' : 'Berhasil Absen Datang', `${user.nama} - ${currentJam}\n${keterangan || 'Tepat Waktu'}`);
                    });

                } else if (currentMode === 'Pulang') {
                    if (existingRecord && existingRecord.pulang !== "") {
                        return triggerPopup('error', 'Ditolak!', `Pegawai ${user.nama} sudah melakukan absen Pulang hari ini.`);
                    }

                    if (jadwalHarian.mulaiPulang && currentJam < jadwalHarian.mulaiPulang) {
                        return triggerPopup('error', 'Belum Diizinkan!', `Absen Pulang dibuka jam ${jadwalHarian.mulaiPulang}`);
                    }

                    let isOvertime = false;
                    let keteranganPulang = existingRecord?.keterangan || "";
                    if (jadwalHarian.batasPulang && currentJam > jadwalHarian.batasPulang) {
                        isOvertime = true;
                        const [bJ, bM] = jadwalHarian.batasPulang.split(':').map(Number);
                        const [cJ, cM] = currentJam.split(':').map(Number);
                        let lemburMenit = (cJ * 60 + cM) - (bJ * 60 + bM);
                        let textLembur = lemburMenit >= 60 ? `Lembur ${Math.floor(lemburMenit/60)}j ${lemburMenit%60}m` : `Lembur ${lemburMenit}m`;
                        keteranganPulang = keteranganPulang ? `${keteranganPulang}, ${textLembur}` : textLembur;
                    }

                    const dataToSave = { tanggal: tanggalSekarang, nip: user.nip, nama: user.nama, datang: existingRecord?.datang || "", pulang: currentJam, status: existingRecord?.status || "Hadir", keterangan: keteranganPulang, jarak: 0 };

                    db.collection('absensi').doc(docId).set(dataToSave, { merge: true }).then(() => {
                        playSuccessSound();
                        triggerPopup(isOvertime ? 'warning' : 'success', 'Berhasil Absen Pulang', `${user.nama} - ${currentJam}\n${isOvertime ? keteranganPulang : 'Tepat Waktu'}`);
                    });
                }
            };

            React.useEffect(() => {
                if (!scanMode) return;
                if (scannerRef.current) return; 

                const html5QrCode = new Html5Qrcode("qr-reader");
                scannerRef.current = html5QrCode;
                
                const startScanner = async () => {
                    try {
                        await html5QrCode.start(
                            { facingMode: "environment" },
                            { fps: 10, qrbox: { width: 250, height: 250 } },
                            (decodedText) => processScan(decodedText),
                            (err) => {}
                        );
                    } catch (err) {
                        try {
                            await html5QrCode.start(
                                { facingMode: "user" },
                                { fps: 10, qrbox: { width: 250, height: 250 } },
                                (decodedText) => processScan(decodedText),
                                (err) => {}
                            );
                        } catch (err2) {
                            setCameraError("Akses kamera ditolak oleh aplikasi Android (WebView). Silakan gunakan tombol Kamera Bawaan di bawah.");
                        }
                    }
                };

                setTimeout(startScanner, 300);

                return () => {
                    if (scannerRef.current) {
                        if (scannerRef.current.isScanning) {
                            scannerRef.current.stop().then(() => scannerRef.current.clear()).catch(e => console.error(e));
                        } else {
                            scannerRef.current.clear();
                        }
                        scannerRef.current = null; 
                    }
                };
            }, [scanMode]);

            const handleFileUpload = (e) => {
                if (!e.target.files || e.target.files.length === 0) return;
                const file = e.target.files[0];
                const html5QrCode = new Html5Qrcode("qr-reader"); 
                
                html5QrCode.scanFile(file, true)
                .then(decodedText => { processScan(decodedText); e.target.value = ''; })
                .catch(err => { triggerPopup('error', 'Gagal Membaca', 'Pastikan foto fokus dan QR Code terlihat jelas.'); e.target.value = ''; });
            };

            return (
                <div className="space-y-6 max-w-xl mx-auto">
                    <div className="text-center">
                        <h2 className="text-2xl font-bold text-slate-800">Scan QR Code</h2>
                        <p className="text-slate-500 text-sm">Arahkan QR Code pada kartu pegawai ke kamera.</p>
                    </div>
                    
                    {!scanMode ? (
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 grid grid-cols-1 md:grid-cols-2 gap-4">
                            <button onClick={() => setScanMode('Datang')} className="p-8 bg-emerald-50 text-emerald-700 hover:bg-emerald-500 hover:text-white rounded-2xl font-bold transition flex flex-col items-center justify-center border border-emerald-200 hover:shadow-lg shadow-emerald-200">
                                <LucideIcon name="log-in" className="w-10 h-10 mb-3" /> Scan DATANG
                            </button>
                            <button onClick={() => setScanMode('Pulang')} className="p-8 bg-rose-50 text-rose-700 hover:bg-rose-500 hover:text-white rounded-2xl font-bold transition flex flex-col items-center justify-center border border-rose-200 hover:shadow-lg shadow-rose-200">
                                <LucideIcon name="log-out" className="w-10 h-10 mb-3" /> Scan PULANG
                            </button>
                        </div>
                    ) : (
                        <div className="bg-white p-4 md:p-6 rounded-3xl shadow-sm border border-slate-100 relative overflow-hidden">
                            <div className="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                                <h3 className={`font-bold text-lg ${scanMode === 'Datang' ? 'text-emerald-600' : 'text-rose-600'}`}>
                                    <LucideIcon name={scanMode === 'Datang' ? 'log-in' : 'log-out'} className="w-5 h-5 inline-block mr-2 mb-1" />
                                    Absen {scanMode}
                                </h3>
                                <button onClick={() => setScanMode(null)} className="px-4 py-1.5 bg-slate-100 text-slate-600 rounded-xl text-sm font-medium hover:bg-slate-200 transition">Kembali</button>
                            </div>

                            {cameraError && (
                                <div className="p-4 mb-4 bg-rose-100 text-rose-700 rounded-xl text-center font-bold text-sm border border-rose-200">
                                    <LucideIcon name="video-off" className="w-6 h-6 inline-block mb-2 text-rose-500" /><br/>
                                    {cameraError}
                                </div>
                            )}
                            
                            {scanPopup && (
                                <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 popup-enter">
                                    <div className={`bg-white p-6 rounded-2xl w-full max-w-sm shadow-2xl text-center border-t-4 ${scanPopup.type === 'error' ? 'border-rose-500' : (scanPopup.type === 'warning' ? 'border-amber-500' : 'border-emerald-500')}`}>
                                        <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${scanPopup.type === 'error' ? 'bg-rose-100 text-rose-600' : (scanPopup.type === 'warning' ? 'bg-amber-100 text-amber-600' : 'bg-emerald-100 text-emerald-600')}`}>
                                            <LucideIcon name={scanPopup.type === 'error' ? 'x-circle' : (scanPopup.type === 'warning' ? 'alert-circle' : 'check-circle')} className="w-8 h-8" />
                                        </div>
                                        <h3 className="text-xl font-bold mb-2 text-slate-800">{scanPopup.title}</h3>
                                        <p className="text-slate-600 font-medium whitespace-pre-line">{scanPopup.msg}</p>
                                    </div>
                                </div>
                            )}
                            
                            <div id="qr-reader" className="w-full overflow-hidden rounded-2xl bg-slate-50 border-2 border-dashed border-teal-200 mb-4" style={{ minHeight: '300px' }}></div>
                            
                            <div className="text-center bg-teal-50 p-4 rounded-2xl border border-teal-100">
                                <p className="text-xs text-teal-800 font-medium mb-3">Aplikasi memblokir kamera? Gunakan tombol di bawah ini untuk memfoto QR dari kamera bawaan HP Anda:</p>
                                <label className="bg-teal-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold hover:bg-teal-700 cursor-pointer inline-flex items-center shadow-md transition">
                                    <LucideIcon name="camera" className="w-4 h-4 mr-2" /> Kamera Bawaan HP
                                    <input type="file" accept="image/*" capture="environment" onChange={handleFileUpload} className="hidden" />
                                </label>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AdminLaporan = ({ settings }) => {
            const hariIni = getTanggalLokal();
            const [tanggalMulai, setTanggalMulai] = React.useState(hariIni);
            const [tanggalAkhir, setTanggalAkhir] = React.useState(hariIni);
            const [filterNama, setFilterNama] = React.useState('');
            
            const [absensi, setAbsensi] = React.useState([]);
            const [isLoading, setIsLoading] = React.useState(false);

            const fetchLaporan = async () => {
                setIsLoading(true);
                try {
                    const snapshotAbsen = await db.collection('absensi').orderBy('tanggal', 'desc').limit(2000).get();
                    const dataAbsen = snapshotAbsen.docs.map(d => ({id: d.id, ...d.data()}));
                    
                    const snapshotPiket = await db.collection('absensi_piket').orderBy('tanggalMulai', 'desc').limit(2000).get();
                    const dataPiketRaw = snapshotPiket.docs.map(d => d.data());
                    const dataPiket = dataPiketRaw.map(p => ({
                        id: p.timestampMulai?.toString() || Math.random().toString(),
                        tanggal: p.tanggalMulai,
                        nip: p.nip,
                        nama: p.nama,
                        datang: p.jamMulai,
                        pulang: p.jamSelesai,
                        status: p.status || 'Hadir',
                        keterangan: p.keterangan || (p.status ? '' : 'Piket Malam')
                    }));

                    const semuaData = [...dataAbsen, ...dataPiket];
                    
                    const dataDifilter = semuaData.filter(a => {
                        return (!tanggalMulai || a.tanggal >= tanggalMulai) && (!tanggalAkhir || a.tanggal <= tanggalAkhir);
                    });
                    
                    setAbsensi(dataDifilter);
                } catch(e) { 
                    console.error("Error Detail Firebase:", e);
                    window.showToast("Error tarik data: " + e.message, "error"); 
                }
                setIsLoading(false);
            };

            const filteredData = absensi.filter(a => a.nama.toLowerCase().includes(filterNama.toLowerCase()));
            const dataDatang = filteredData.filter(a => a.datang !== "");
            const dataPulang = filteredData.filter(a => a.pulang !== "");

            const cetakPDF = () => {
                if (dataDatang.length === 0 && dataPulang.length === 0) {
                    window.showToast("Tidak ada data untuk dicetak pada rentang tanggal ini.", "warning");
                    return;
                }
                const printWindow = window.open('', '_blank');
                const logoHtml = settings?.logoUrl ? `<img src="${settings.logoUrl}" style="height: 80px; object-fit: contain; margin-bottom: 10px;" />` : '';
                
                const headerHtml = `
                    <div style="text-align: center; border-bottom: 4px double black; padding-bottom: 15px; margin-bottom: 20px;">
                        ${logoHtml}
                        <h1 style="font-size: 20px; font-weight: bold; margin: 0; text-transform: uppercase;">PEMERINTAH KABUPATEN NAGEKEO</h1>
                        <h2 style="font-size: 18px; font-weight: bold; margin: 0; text-transform: uppercase;">DINAS KESEHATAN</h2>
                        <h2 style="font-size: 24px; font-weight: bold; margin: 8px 0; text-transform: uppercase; color: #333;">${settings?.sekolah || 'NAMA PUSKESMAS'}</h2>
                        <p style="font-size: 14px; margin: 0; color: #555;">${settings?.alamat || '-'}</p>
                    </div>
                `;

                let tbodyDatang = dataDatang.length === 0 ? `<tr><td colspan="5" style="padding: 10px; text-align: center; border: 1px solid #000;">Tidak ada laporan.</td></tr>` : '';

                                                            else if (record.status === 'Sakit') mark = 'S';
                                                            else if (record.status === 'Izin') mark = 'I';
                                                            else if (record.status === 'Dinas Luar') mark = 'DL';
                                                            else if (record.status === 'Alpa') mark = 'A';
                                                        } else {
                                                            if (d <= todayStr) mark = 'A';
                                                        }
                                                        
                                                        if (mark==='H') c_H++; else if(mark==='HT') c_HT++; else if(mark==='S') c_S++; else if(mark==='I') c_I++; else if(mark==='A') c_A++; else if(mark==='DL') c_DL++;
                                                        return <td key={idx} className="p-1 border border-slate-300 text-center font-medium">{mark}</td>;
                                                    })}
                                                    <td className="p-1 border border-slate-300 text-center font-bold text-emerald-600">{c_H}</td>
                                                    <td className="p-1 border border-slate-300 text-center font-bold text-amber-500">{c_HT}</td>
                                                    <td className="p-1 border border-slate-300 text-center font-bold text-sky-500">{c_S}</td>
                                                    <td className="p-1 border border-slate-300 text-center font-bold text-teal-500">{c_I}</td>

                                                    <td className="p-1 border border-slate-300 text-center font-bold text-purple-500">{c_DL}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
